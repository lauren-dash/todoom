[project]
name = "collect-outstanding-tasks-skill"
version = "0.1.0"
description = "Collects the user's outstanding tasks from every source into one task list"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["collect_outstanding_tasks_skill"]
