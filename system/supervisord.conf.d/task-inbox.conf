[program:task-inbox]
command=python3 system/services/oom_priority/bin/oom_tag_service.py user bash -c "python3 system/scripts/workspace_bare_scripts/venv_links.py ensure-project system/apps/task_inbox && uv sync --locked --project system/apps/task_inbox && python3 system/scripts/forward_port.py --manifest system/apps/task_inbox/app.toml --url http://localhost:8080 && exec system/apps/task_inbox/.venv/bin/task-inbox"
directory=/home/user/workspace
autostart=true
autorestart=true
startsecs=30
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/task-inbox-stdout.log
stderr_logfile=/var/log/supervisor/task-inbox-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
