<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TODOOM</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>if (localStorage.getItem("theme") === "light") document.documentElement.dataset.theme = "light";</script>
<style>
  /* HQ design system: monochrome, monospace, square corners, uppercase labels. */
  @font-face { font-family: departureMono; src: url(/assets/departure-mono.woff2) format("woff2"); font-display: swap; }
  /* Dark by default (the design system's dark palette). */
  :root {
    color-scheme: dark;
    --fg: hsl(0 0% 95%); --bg: hsl(0 0% 8%); --muted: hsl(0 0% 60%); --dim: hsl(0 0% 60% / .6);
    --line: hsl(0 0% 95% / .14); --border: hsl(0 0% 25%); --card: hsl(0 0% 11%); --sel: hsl(0 0% 14%); --secondary: hsl(0 0% 18%);
    --green: hsl(120 100% 45%); --amber: hsl(45 100% 55%); --red: hsl(0 100% 60%);
    --body: ui-monospace, SFMono-Regular, Menlo, monospace; --disp: departureMono, ui-monospace, monospace;
  }
  html[data-theme="light"] {
    color-scheme: light;
    --fg: hsl(0 0% 0%); --bg: hsl(0 0% 100%); --muted: hsl(0 0% 40%); --dim: hsl(0 0% 40% / .6);
    --line: hsl(0 0% 0% / .14); --border: hsl(0 0% 15%); --card: hsl(0 0% 97%); --sel: hsl(0 0% 95%); --secondary: hsl(0 0% 90%);
    --green: hsl(120 100% 30%); --amber: hsl(32 100% 30%); --red: hsl(0 100% 45%);
  }
  * { box-sizing: border-box; border-radius: 0; }
  body { overflow-x: hidden; margin: 0; background: var(--bg); color: var(--fg); font: 400 14px/1.4 var(--body); font-feature-settings: "liga" 0; -webkit-font-smoothing: antialiased; height: 100vh; display: grid; grid-template-rows: auto auto 1fr; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  ul { list-style: none; margin: 0; padding: 0; }
  .label { font-size: 10px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; }
  .tiny { font-size: 11px; color: var(--muted); }

  /* Top bar */
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 2px solid var(--border); }
  .wordmark { font-family: var(--disp); font-size: 22px; letter-spacing: .06em; }
  .updated { margin-left: auto; font-size: 11px; color: var(--muted); white-space: nowrap; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; line-height: 1; border: 1px solid var(--line); height: 26px; padding: 0 10px; font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--fg); text-decoration: none; transition: border-color .15s; }
  .btn:hover { border-color: var(--fg); }
  .btn:disabled { cursor: default; color: var(--muted); border-color: var(--line); }
  .btn.icon { width: 26px; padding: 0; }
  .btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .notes { padding: 8px 20px; font-size: 11px; color: var(--amber); border-bottom: 1px solid var(--line); }
  .notes:empty { padding: 0; border: 0; }  /* stays in the layout so the lists fill the window */

  /* Sidebar + list */
  main { display: grid; grid-template-columns: 210px minmax(0, 1fr); min-height: 0; min-width: 0; }
  .rail { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  nav { padding: 16px 0; display: flex; flex-direction: column; gap: 2px; overflow: auto; flex: 1; }
  .view { display: flex; justify-content: space-between; padding: 7px 20px; color: var(--muted); text-align: left; }
  .view:hover { color: var(--fg); }
  .view[aria-current="true"] { color: var(--fg); box-shadow: inset 2px 0 0 var(--fg); background: var(--card); }
  .view .n { font-size: 12px; }
  .view.warn .n { color: var(--amber); }
  .navsep { height: 1px; background: var(--line); margin: 12px 20px; }
  .searchbtn { margin: 12px 16px 16px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--line); padding: 5px 8px; color: var(--muted); font-size: 13px; text-align: left; }
  .searchbtn:hover { border-color: var(--fg); color: var(--fg); }
  /* The weekly recap: a quiet link, not a list, so it sits apart at the bottom. */
  .recaplink { margin: 0 20px; padding: 6px 0; color: var(--dim); font-size: 12px; text-align: left; }
  .recaplink:hover, .recaplink[aria-current="true"] { color: var(--fg); }
  .weeknav { display: inline-flex; gap: 6px; }
  .view.recaptab { display: none; }
  .recap-day { padding: 18px 24px 6px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); }
  .recap-item { display: block; width: 100%; text-align: left; padding: 9px 24px; border-bottom: 1px solid var(--line); }
  .recap-item:hover { background: var(--sel); }
  .recap-item .rt { display: block; font-weight: 600; }
  .recap-item .rm { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .kbd { font-size: 10px; border: 1px solid var(--line); padding: 1px 5px; color: var(--muted); white-space: nowrap; }

  section.list { overflow: auto; min-height: 0; min-width: 0; display: flex; flex-direction: column; }
  section.list > .split { flex: 1 0 auto; }
  .listhead { padding: 18px 24px 12px; display: flex; align-items: baseline; gap: 14px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 3; }
  .listhead h1 { margin: 0; font-family: var(--disp); font-weight: 400; font-size: 24px; letter-spacing: .04em; }
  .listhead .sub { color: var(--muted); font-size: 12px; }
  .listhead .right { margin-left: auto; }
  .split { display: grid; grid-template-columns: 1fr 1fr; }
  .split > div { min-width: 0; }
  .split > div + div { border-left: 1px solid var(--line); }
  .colhead { padding: 14px 24px 8px; border-bottom: 1px solid var(--line); }
  .colhead h2 { margin: 0; font-family: var(--disp); font-weight: 400; font-size: 18px; letter-spacing: .04em; }
  .clear { padding: 28px 24px; color: var(--muted); }
  .todaytabs { display: none; gap: 22px; padding: 0 14px; border-bottom: 1px solid var(--line); }
  .todaytab { padding: 12px 0 10px; color: var(--muted); font-family: var(--disp); font-size: 16px; letter-spacing: .04em; }
  .todaytab[aria-selected="true"] { color: var(--fg); box-shadow: inset 0 -2px 0 var(--fg); }

  /* Quiet rows: title + one line. Actions sit on that line and fade in on hover,
     so nothing moves as you scroll past. */
  li.task { display: grid; grid-template-columns: 20px 1fr auto; gap: 2px 12px; padding: 9px 24px; border-bottom: 1px solid var(--line); align-items: start; position: relative; transition: opacity .45s ease; }
  li.task:hover { background: var(--sel); }
  li.task input[type=checkbox] { appearance: none; width: 14px; height: 14px; margin: 2px 0 0; border: 1.5px solid var(--fg); background: var(--bg); cursor: pointer; display: grid; place-content: center; }
  li.task input[type=checkbox]:checked { background: var(--fg); }
  li.task input[type=checkbox]:checked::after { content: ""; width: 7px; height: 3px; border: solid var(--bg); border-width: 0 0 2px 2px; transform: translateY(-1px) rotate(-45deg); }
  li.task input[type=checkbox]:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .title { justify-self: start; max-width: 100%; min-width: 4ch; font-weight: 600; outline: none; cursor: text; margin: 0 -4px; padding: 0 4px; text-decoration: line-through; text-decoration-color: transparent; text-decoration-thickness: 2px; transition: text-decoration-color .3s ease .1s, color .3s ease .1s; }
  .title:hover { background: color-mix(in srgb, var(--fg) 6%, transparent); }
  .title:focus { background: var(--card); box-shadow: inset 0 -1px 0 var(--fg); }
  /* Checking a task off: the box pops, the check mark draws in, the title is struck through and the row fades. */
  li.task.completing { opacity: .35; }
  li.task.completing .title, li.task.checked .title { text-decoration-color: var(--dim); color: var(--dim); }
  li.task.checked { opacity: .45; }
  li.task.checked .title { pointer-events: none; transition: none; }
  /* After its moment crossed off, a done task fades and the gap closes. */
  li.task.leaving { overflow: hidden; animation: leave .7s ease-in forwards; }
  @keyframes leave { 0% { opacity: .45; max-height: var(--h); } 45% { opacity: 0; max-height: var(--h); } 100% { opacity: 0; max-height: 0; padding-top: 0; padding-bottom: 0; border-bottom-width: 0; } }
  li.task.completing input[type=checkbox] { animation: check-pop .28s ease-out; }
  li.task.completing input[type=checkbox]::after { animation: check-draw .22s ease-out .05s both; }
  @keyframes check-pop { 0% { transform: scale(1); } 45% { transform: scale(1.3); } 100% { transform: scale(1); } }
  @keyframes check-draw { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  li.task.flash { animation: flash 1.4s ease-out; }
  @keyframes flash { 0%, 30% { background: var(--secondary); } 100% { background: transparent; } }
  @media (prefers-reduced-motion: reduce) { li.task, .title { transition: none; } li.task.completing input[type=checkbox], li.task.completing input[type=checkbox]::after, li.task.flash, li.task.leaving { animation: none; } }
  .chip { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; color: var(--muted); transition: opacity .12s; }
  .chip.today { color: var(--red); font-weight: 600; }
  .chip.late { color: var(--amber); }
  .chip.agent-on { color: var(--green); }
  /* The actions have their own line under the task, held open while hidden,
     so hovering never moves anything. */
  .actions { grid-column: 2 / 4; display: flex; gap: 16px; font-size: 11px; line-height: 16px; min-height: 16px; opacity: 0; pointer-events: none; transition: opacity .12s; }
  li.task:hover .actions, li.task:focus-within .actions { opacity: 1; pointer-events: auto; }
  .actions button, .actions .due-pick > span, .v-acts button, .v-acts .due-pick > span { color: var(--fg); box-shadow: inset 0 -1px 0 var(--line); white-space: nowrap; }
  .actions button:hover, .v-acts button:hover { box-shadow: inset 0 -1px 0 var(--fg); }
  .actions .agent, .v-acts .agent { color: var(--green); box-shadow: inset 0 -1px 0 var(--green); }
  .actions .nt, .v-acts .nt { color: var(--muted); box-shadow: none; }
  .actions .nt:hover, .v-acts .nt:hover { color: var(--red); }
  /* Overdue and Snoozed are for deciding, so their actions always show, on a line of their own. */
  .decide .actions { opacity: 1; pointer-events: auto; }
  /* The date field sits invisibly over its label, so a real click opens the browser's
     own calendar (opening it from code is blocked inside Studio's app frames). */
  .due-pick { position: relative; display: inline-flex; }
  .due-pick input[type=date] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; padding: 0; margin: 0; cursor: pointer; font: inherit; }
  .due-pick input[type=date]::-webkit-calendar-picker-indicator { position: absolute; inset: 0; width: auto; height: auto; margin: 0; padding: 0; cursor: pointer; }
  .menu { position: absolute; left: 56px; top: calc(100% - 6px); z-index: 5; background: var(--bg); border: 1.5px solid var(--fg); box-shadow: 4px 4px 0 color-mix(in srgb, var(--fg) 15%, transparent); display: flex; flex-direction: column; min-width: 170px; }
  .menu button { text-align: left; padding: 7px 12px; font-size: 12px; }
  .menu button:hover { background: var(--sel); }
  .add-row { padding: 8px 24px; border-bottom: 1px solid var(--line); }
  .add-in { width: 100%; font: inherit; font-size: 13px; color: var(--fg); background: none; border: 0; padding: 4px 0; outline: none; }
  .add-in::placeholder { color: var(--muted); }
  .add-in:focus { box-shadow: inset 0 -1px 0 var(--fg); }
  .in { flex: 1; font: inherit; font-size: 13px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); padding: 6px 8px; }
  .in:focus { outline: none; border-color: var(--fg); }
  .slip { grid-column: 2 / 4; display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .form-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  textarea.in { resize: vertical; }
  .removed-row { padding: 10px 24px; border-bottom: 1px solid var(--line); background: var(--card); display: flex; flex-direction: column; gap: 8px; transition: opacity 1.5s ease; }
  .removed-row.fading { opacity: 0; }
  .removed-head { display: flex; align-items: baseline; gap: 12px; }
  .removed-title { color: var(--dim); text-decoration: line-through; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lnk { color: var(--fg); box-shadow: inset 0 -1px 0 var(--line); font-size: 11px; }
  .finish { padding: 80px 24px; text-align: center; }
  .finish h2 { font-family: var(--disp); font-weight: 400; font-size: 34px; margin: 0 0 10px; letter-spacing: .04em; }
  .finish p { color: var(--muted); margin: 4px 0; }

  /* View: the original message inside TODOOM, with a way out to where it lives. */
  .scrim { position: fixed; inset: 0; background: hsl(0 0% 0% / .6); backdrop-filter: blur(2px); display: none; z-index: 20; }
  .viewing .scrim, .spotting .scrim { display: block; }
  .viewer { position: fixed; top: 8vh; left: 50%; transform: translateX(-50%); width: min(640px, 92vw); max-height: 84vh; z-index: 21; background: var(--bg); border: 2px solid var(--fg); box-shadow: 6px 6px 0 color-mix(in srgb, var(--fg) 12%, transparent); display: none; flex-direction: column; }
  .viewing .viewer { display: flex; }
  .v-head { display: flex; align-items: center; gap: 12px; padding: 0 10px 0 14px; height: 36px; border-bottom: 2px solid var(--fg); }
  .v-head .tiny { margin-left: auto; }
  .v-main { padding: 16px; overflow: auto; flex: 1; }
  .v-main h3 { margin: 0 0 6px; font-size: 15px; }
  .v-why { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .v-why:empty { display: none; }
  .rawbody { white-space: pre-wrap; font-size: 13px; border: 1px solid var(--line); background: var(--card); padding: 12px; }
  .chat { display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 88%; } .msg.me { align-self: flex-end; text-align: right; }
  .msg .who { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
  .msg .bubble { display: inline-block; text-align: left; white-space: pre-wrap; border: 1px solid var(--line); background: var(--card); padding: 8px 10px; font-size: 13px; }
  .msg.me .bubble { background: var(--secondary); } .msg.this .bubble { border: 2px solid var(--fg); }
  .also { margin-top: 14px; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
  .v-foot { padding: 12px 14px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .v-acts { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; align-items: center; }
  .v-acts .tiny { margin-right: -6px; }
  .v-foot a[hidden] { display: none; }
  .open-src { height: 30px; padding: 0 14px; border-color: color-mix(in srgb, var(--fg) 45%, transparent); }
  .open-src:hover { background: var(--fg); color: var(--bg); border-color: var(--fg); }

  /* Search (Option-Space, or the box in the sidebar): results listed under the box. */
  .spot { position: fixed; z-index: 31; top: 14vh; left: 50%; transform: translateX(-50%); width: min(640px, calc(100vw - 32px)); background: var(--bg); border: 2px solid var(--fg); box-shadow: 6px 6px 0 color-mix(in srgb, var(--fg) 12%, transparent); display: none; flex-direction: column; max-height: 72vh; }
  .spotting .spot { display: flex; }
  .spot-head { display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--line); }
  .spot-in { flex: 1; height: 52px; font: inherit; font-size: 20px; color: var(--fg); background: none; border: 0; outline: none; }
  .spot-in::placeholder { color: var(--muted); }
  .spot-list { overflow: auto; }
  .spot-list:empty { display: none; }
  .spot-group { padding: 10px 14px 4px; color: var(--muted); }
  .spot-item { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 8px 14px; cursor: pointer; border-left: 3px solid transparent; }
  .spot-item[aria-selected="true"] { background: var(--secondary); border-left-color: var(--fg); }
  .spot-item .st { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .spot-item.done .st { text-decoration: line-through; color: var(--dim); }
  .spot-item .ss { color: var(--muted); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
  .spot-foot { display: flex; gap: 14px; padding: 8px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
  .spot-empty { padding: 16px 14px; color: var(--muted); }
  mark { background: none; color: inherit; box-shadow: inset 0 -2px 0 var(--amber); }

  /* Narrow windows: the sidebar becomes a row along the top, and Today stacks. */
  @media (max-width: 860px) {
    main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
    .rail { border-right: 0; border-bottom: 1px solid var(--line); flex-direction: row; align-items: center; min-width: 0; }
    nav { flex-direction: row; padding: 0; overflow-x: auto; min-width: 0; scrollbar-width: none; }
    .view { flex: none; }
    .view { padding: 10px 12px; gap: 6px; } .view[aria-current="true"] { box-shadow: inset 0 -2px 0 var(--fg); }
    .navsep { display: none; }
    .recaplink { display: none; } .view.recaptab { display: flex; }
    .searchbtn { margin: 6px 12px; gap: 8px; }
    .split { grid-template-columns: 1fr; } .split > div + div { border-left: 0; }
    .todaytabs { display: flex; }
    .split .colhead { display: none; }
    .split[data-tab="personal"] > [data-col="work"], .split[data-tab="work"] > [data-col="personal"] { display: none; }
  }
  @media (max-width: 560px) {
    header { padding: 10px 14px; gap: 10px; }
    .updated { font-size: 10px; }
    .searchbtn { flex: none; margin: 6px 10px; } .searchbtn .kbd { display: none; }
    .listhead, .colhead, .add-row, .recap-day, .recap-item { padding-left: 14px; padding-right: 14px; }
    .listhead { flex-wrap: wrap; } .listhead .right { margin-left: 0; }
    li.task { grid-template-columns: 20px minmax(0, 1fr); padding: 10px 14px; }
    li.task .chip { grid-column: 2; grid-row: 2; }
    li.task .chip:empty { display: none; }
    .title { overflow-wrap: anywhere; }
    /* No hover on a phone: tapping a task (not its text) opens View, which has the actions. */
    li.task:not(.decide) .actions { display: none; }
    li.task:hover { background: none; }
    .decide .actions { grid-column: 2; grid-row: 3; flex-wrap: wrap; gap: 10px 18px; padding-top: 4px; }
    .v-acts { gap: 10px 18px; }
  }
</style>
</head>
<body>
<header>
  <span class="wordmark">TODOOM</span>
  <span class="updated" id="updated"></span>
  <button class="btn icon" id="theme" type="button"></button>
  <button class="btn" id="refresh" type="button">Refresh</button>
</header>
<div class="notes" id="notes"></div>
<main>
  <aside class="rail">
    <nav id="nav" aria-label="Lists"></nav>
    <button class="recaplink" id="open-recap" type="button">Weekly recap</button>
    <button class="searchbtn" id="open-search" type="button"><span>Search</span><span class="kbd">Opt Space</span></button>
  </aside>
  <section class="list" id="list"></section>
</main>
<div class="scrim" id="scrim"></div>
<div class="viewer" id="viewer" role="dialog" aria-label="Original message">
  <div class="v-head"><span class="label" id="v-src"></span><span class="tiny" id="v-sub"></span><button class="btn" id="v-close" type="button">Close</button></div>
  <div class="v-main"><h3 id="v-title"></h3><p class="v-why" id="v-why"></p><div id="v-body"></div><div class="also" id="v-also" hidden></div></div>
  <div class="v-foot" id="v-foot"><div class="v-acts" id="v-acts"></div><a class="btn open-src" id="v-open" target="_blank" rel="noopener"></a></div>
</div>
<div class="spot" id="spot" role="dialog" aria-label="Search tasks">
  <div class="spot-head">
    <span class="label">Search</span>
    <input class="spot-in" id="spot-in" type="text" placeholder="Search your tasks" aria-label="Search your tasks" autocomplete="off" spellcheck="false" role="combobox" aria-controls="spot-list" aria-expanded="true">
  </div>
  <div class="spot-list" id="spot-list" role="listbox"></div>
  <div class="spot-foot"><span>↑↓ to move</span><span>Enter to go to the task</span><span>Cmd Enter to view it</span><span>Esc to close</span></div>
</div>
<script>
let DATA = { tasks: [] };
const SOURCES = { email: "Gmail", slack: "Slack", "google-docs": "Google Docs", notion: "Notion", whatsapp: "WhatsApp", text: "Messages", manual: "You" };
const TABS = ["personal", "work"];
// "Do it for me" only where an agent can actually do the thing.
const AGENT_OK = /\b(rsvp|pay|sign up|schedule|book|order|activate|renew|register|buy|cancel|return|transfer|venmo|confirm)\b/i;
const TODAY_PER_TAB = 5;
let view = "today";
let todayTab = "personal";   // which half of Today a narrow screen shows
let menuFor = null;          // task id whose snooze menu is open
const removed = new Map();   // "Not a task" this session: shown as a slip to add a reason or undo
const delegating = new Set(); // "Do it for me" slips open

function localDay(d = new Date()) { return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function addDays(n) { const d = new Date(); d.setDate(d.getDate() + n); return localDay(d); }
function daysBetween(a, b) { return Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 86400000); }
function ageDays(t) { return t.date ? (Date.now() - new Date(t.date)) / 86400000 : 0; }
function lateDays(t) { return t.due ? daysBetween(t.due, localDay()) : null; }
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([k, v]) => k === "class" ? n.className = v : k.startsWith("on") ? n.addEventListener(k.slice(2), v) : n.setAttribute(k, v));
  kids.flat().forEach(k => k != null && n.append(k));
  return n;
}
// Look-later tasks are titled by what the message says, not by who sent it.
function shownTitle(t) {

  // Tasks you add (with no due date) go to the bottom of the list you added them in,
  // in the order you added them, and never count against Today's cap.
  const added = t => t.source === "manual" && !t.due;
  const oldestFirst = (a, b) => ((a.date || "") < (b.date || "") ? -1 : 1);
  if (v === "today") {
    const pick = t => t.tab === tab && !isOverdue(t) && inToday(t);
    const open = ts.filter(t => stays(t) && pick(t));
    return [...open.filter(t => !added(t)).sort(byLate).slice(0, TODAY_PER_TAB), ...open.filter(added).sort(oldestFirst)];
  }
  if (v === "personal" || v === "work") {

    return [...open.filter(t => !added(t)).sort(byDue), ...open.filter(added).sort(oldestFirst)];
  }

}
