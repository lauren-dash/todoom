[project]
name = "task-inbox"
version = "0.1.0"
description = "Outstanding tasks from email, Slack, texts, WhatsApp, Docs and Notion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-sock>=0.7",
    "werkzeug>=3.0",
]

[project.scripts]
task-inbox = "task_inbox.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/task_inbox"]
