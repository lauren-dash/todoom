    <line x1="0" y1="108.5" x2="120" y2="108.5" stroke="#2c2c2c" stroke-width="0.75"/>

    <rect x="10" y="115" width="7" height="7" fill="none" stroke="#bdbdbd" stroke-width="0.75"/>
