    <line x1="0" y1="81.5" x2="120" y2="81.5" stroke="#2c2c2c" stroke-width="0.75"/>

    <rect x="10" y="88" width="7" height="7" fill="#f2f2f2" stroke="#f2f2f2" stroke-width="0.75"/>
    <path d="M11.6 91.6 L13.2 93.3 L15.6 89.8" fill="none" stroke="#141414" stroke-width="1.1"/>
    <text x="22" y="94" font-size="6.2" fill="#6f6f6f">Venmo Sam for dinner</text>
    <line x1="22" y1="92" x2="96.5" y2="92" stroke="#6f6f6f" stroke-width="0.6"/>
