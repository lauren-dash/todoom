    <text x="22" y="129" font-size="5" fill="#8a8a8a">WHATSAPP · JORDAN</text>
    <line x1="0" y1="135.5" x2="120" y2="135.5" stroke="#2c2c2c" stroke-width="0.75"/>
    <text x="10" y="148" font-size="5.5" fill="#6f6f6f">+ ADD A TASK</text>

    <!-- work rows -->
    <rect x="130" y="53" width="7" height="7" fill="none" stroke="#bdbdbd" stroke-width="0.75"/>
    <text x="142" y="59" font-size="6.2">Send Casey the deck</text>
    <text x="142" y="67" font-size="5" fill="#8a8a8a">EMAIL · DUE MON</text>
    <line x1="121" y1="81.5" x2="240" y2="81.5" stroke="#2c2c2c" stroke-width="0.75"/>

    <rect x="130" y="88" width="7" height="7" fill="none" stroke="#bdbdbd" stroke-width="0.75"/>
    <text x="142" y="94" font-size="6.2">Answer Morgan on layout</text>
    <text x="142" y="102" font-size="5" fill="#8a8a8a">SLACK · MORGAN LEE</text>
    <line x1="121" y1="108.5" x2="240" y2="108.5" stroke="#2c2c2c" stroke-width="0.75"/>

    <rect x="130" y="115" width="7" height="7" fill="none" stroke="#bdbdbd" stroke-width="0.75"/>
    <text x="142" y="121" font-size="6.2">Reply on the launch doc</text>
