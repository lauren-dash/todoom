<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="TODOOM: a two-column to-do list, Personal and Work">
  <rect width="240" height="160" fill="#141414"/>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" fill="#f2f2f2">
    <!-- header -->
    <text x="10" y="17" font-size="9" font-weight="700" letter-spacing="1">TODOOM</text>
    <line x1="0" y1="27.5" x2="240" y2="27.5" stroke="#3a3a3a" stroke-width="0.75"/>
    <line x1="120.5" y1="28" x2="120.5" y2="160" stroke="#3a3a3a" stroke-width="0.75"/>

    <!-- column labels -->
